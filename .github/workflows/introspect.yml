# introspect.yml
#
# art-core.js is 2.68 MB: too large for the contents API, not indexed by
# code search, and raw fetches of it time out. That makes the single most
# important file in the game invisible to tooling.
#
# This runs grep inside CI instead. Push a line to introspect/request.txt
# in the form
#
#     <file>|<extended regex>
#
# and the job writes the matches, truncated to 400 characters per line,
# into introspect/report.txt and commits it back. Lines starting with #
# are ignored. The path filter means the report commit cannot retrigger
# the workflow.

name: introspect

on:
  push:
    paths:
      - 'introspect/request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the requested searches
        run: |
          mkdir -p introspect
          {
            echo "# introspect report"
            echo "# generated: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "# commit: ${GITHUB_SHA}"
            echo
            echo "## file sizes"
            ls -l *.js 2>/dev/null | awk '{print $5, $9}'
            echo
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) continue ;; esac
              file="${line%%|*}"
              pat="${line#*|}"
              echo "=== FILE: $file"
              echo "=== PATTERN: $pat"
              if [ -f "$file" ]; then
                grep -n -E -m 60 "$pat" "$file" | cut -c1-400 || echo "(no match)"
              else
                echo "(file not found)"
              fi
              echo
            done < introspect/request.txt
          } > introspect/report.txt 2>&1

      - name: Commit the report
        run: |
          git config user.name "introspect-bot"
          git config user.email "actions@github.com"
          git add introspect/report.txt
          git commit -m "introspect: report for ${GITHUB_SHA:0:7}" || exit 0
          git push
