# introspect.yml
#
# art-core.js is 2.68 MB: too large for the contents API, not indexed by
# code search, and raw fetches of it time out. That makes the single most
# important file in the game invisible to tooling.
#
# This runs grep and sed inside CI instead. Push lines to
# introspect/request.txt in either form:
#
#     <file>|<extended regex>     -> numbered grep matches
#     <file>@<start>-<end>        -> that exact line range
#
# Output lands in introspect/report.txt, truncated to 400 characters per
# line, and is committed back. Lines starting with # are ignored. The
# path filter means the report commit cannot retrigger the workflow.

name: introspect

on:
  push:
    paths:
      - 'introspect/request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the requested searches
        run: |
          mkdir -p introspect
          {
            echo "# introspect report"
            echo "# generated: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "# commit: ${GITHUB_SHA}"
            echo
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) continue ;; esac
              case "$line" in
                *@*-*)
                  file="${line%%@*}"
                  range="${line#*@}"
                  from="${range%%-*}"
                  to="${range##*-}"
                  echo "=== FILE: $file  LINES $from-$to"
                  if [ -f "$file" ]; then
                    sed -n "${from},${to}p" "$file" | cat -n | awk -v s="$from" '{ $1 = $1 + s - 1; print }' | cut -c1-400
                  else
                    echo "(file not found)"
                  fi
                  echo
                  ;;
                *)
                  file="${line%%|*}"
                  pat="${line#*|}"
                  echo "=== FILE: $file"
                  echo "=== PATTERN: $pat"
                  if [ -f "$file" ]; then
                    grep -n -E -m 60 "$pat" "$file" | cut -c1-400 || echo "(no match)"
                  else
                    echo "(file not found)"
                  fi
                  echo
                  ;;
              esac
            done < introspect/request.txt
          } > introspect/report.txt 2>&1

      - name: Commit the report
        run: |
          git config user.name "introspect-bot"
          git config user.email "actions@github.com"
          git add introspect/report.txt
          git commit -m "introspect: report for ${GITHUB_SHA:0:7}" || exit 0
          git push
